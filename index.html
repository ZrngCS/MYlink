    <!-- Live Clock & Greeting Script -->
    <script>
        function updateClock() {
            const greetingEl = document.getElementById('greeting');
            const statusEl = document.getElementById('status-text');
            const currentLang = document.documentElement.lang;

            const now = new Date();
            const hour = now.getHours();
            let greet = '';
            let status = '';

            let timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            if (currentLang === 'ckb') {
                if (hour < 12) {
                    greet = 'بەیانی باش';
                    status = 'ئامادە بۆ کار';
                } else if (hour < 18) {
                    greet = 'ڕۆژ باش';
                    status = 'ئامادە بۆ کار';
                } else {
                    greet = 'ئێوارە باش';
                    status = 'ئامادە بۆ کار';
                }
                greet += ` - ${timeStr}`;
            } else {
                if (hour < 12) {
                    greet = 'Good Morning';
                    status = 'Available for work';
                } else if (hour < 18) {
                    greet = 'Good Afternoon';
                    status = 'Available for work';
                } else {
                    greet = 'Good Evening';
                    status = 'Available for work';
                }
                greet += ` - ${timeStr}`;
            }

            greetingEl.textContent = greet;
            statusEl.textContent = status;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>

    <!-- Typewriter Script -->
    <script>
        const bioEl = document.getElementById('bio');
        let typingInterval;

        function typeWriter(text) {
            clearInterval(typingInterval);
            bioEl.textContent = '';
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    bioEl.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                }
            }, 50);
        }
    </script>

    <!-- Language Toggle Script -->
    <script>
        const langBtn = document.getElementById('lang-toggle');
        const linkTexts = document.querySelectorAll('.link-text');
        const arrows = document.querySelectorAll('.arrow');
        const profileNameEl = document.getElementById('profile-name');
        const footerTextEl = document.getElementById('footer-text');
        let isKurdish = false;

        function setLanguage() {
            if (isKurdish) {
                document.documentElement.lang = 'ckb';
                document.documentElement.dir = 'rtl';
                document.title = 'زرنگ سەرکان غەفوور | بەستەرەکان';
                langBtn.innerHTML = '<i class="fa-solid fa-globe"></i> EN';
                profileNameEl.textContent = 'زرنگ سەرکان غەفوور';
                footerTextEl.textContent = 'زرنگ سەرکان غەفوور. هەموو مافەکان پارێزراون.';
                typeWriter('خوێندکاری زانستی کۆمپیوتەر لە زانکۆی سلێمانی');
                linkTexts.forEach(el => el.textContent = el.parentElement.getAttribute('data-ckb'));
                arrows.forEach(arrow => arrow.classList.replace('fa-arrow-right', 'fa-arrow-left'));
                document.getElementById('cmd-input').placeholder = 'گەڕان بۆ بەستەرەکان...';
            } else {
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
                document.title = 'Zrng Sarkan Ghafur | Links';
                langBtn.innerHTML = '<i class="fa-solid fa-globe"></i> کوردی';
                profileNameEl.textContent = 'Zrng Sarkan Ghafur';
                footerTextEl.textContent = 'Zrng Sarkan Ghafur. All rights reserved.';
                typeWriter('Computer Science Student at University of Sulaimani');
                linkTexts.forEach(el => el.textContent = el.parentElement.getAttribute('data-en'));
                arrows.forEach(arrow => arrow.classList.replace('fa-arrow-left', 'fa-arrow-right'));
                document.getElementById('cmd-input').placeholder = 'Search for links...';
            }
            updateClock();
            renderCmdResults(document.getElementById('cmd-input').value);
        }

        langBtn.addEventListener('click', () => {
            isKurdish = !isKurdish;
            setLanguage();
        });

        window.addEventListener('load', () => {
            setTimeout(() => typeWriter('Computer Science Student at University of Sulaimani'), 1000);
        });
    </script>

    <!-- Command Palette Script -->
    <script>
        const cmdOverlay = document.getElementById('cmd-overlay');
        const cmdInput = document.getElementById('cmd-input');
        const cmdResults = document.getElementById('cmd-results');
        const searchBtn = document.getElementById('search-btn');

        function openCmd() {
            cmdOverlay.classList.add('active');
            setTimeout(() => cmdInput.focus(), 100);
            renderCmdResults('');
        }

        function closeCmd() {
            cmdOverlay.classList.remove('active');
            cmdInput.value = '';
        }

        searchBtn.addEventListener('click', openCmd);

        cmdOverlay.addEventListener('click', (e) => {
            if (e.target === cmdOverlay) closeCmd();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                cmdOverlay.classList.contains('active') ? closeCmd() : openCmd();
            }
            if (e.key === 'Escape') closeCmd();
        });

        function renderCmdResults(query) {
            const items = document.querySelectorAll('.link-card');
            let html = '';
            let found = 0;

            items.forEach(item => {
                const text = isKurdish ? item.getAttribute('data-ckb') : item.getAttribute('data-en');
                const href = item.getAttribute('href');
                const icon = item.querySelector('i:first-child').outerHTML;

                if (text.toLowerCase().includes(query.toLowerCase())) {
                    html += `<a href="${href}" target="_blank" rel="noopener noreferrer" class="cmd-item">${icon}<span>${text}</span></a>`;
                    found++;
                }
            });

            if (found === 0) {
                cmdResults.innerHTML = `<div class="cmd-empty">${isKurdish ? 'هیچ ئەنجامێک نەدۆزرایەوە' : 'No results found'}</div>`;
            } else {
                cmdResults.innerHTML = html;
            }
        }

        cmdInput.addEventListener('input', (e) => renderCmdResults(e.target.value));
    </script>

    <!-- Web Share API Script -->
    <script>

    <!-- PERFORMANCE: Only run heavy JS on Desktop (Hover supported devices) -->
    <script>
        const isDesktop = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

        if (isDesktop) {
            // Interactive Mouse Glow Script
            const cursorGlow = document.getElementById('cursor-glow');
            let glowX = window.innerWidth / 2;
            let glowY = window.innerHeight / 2;
            let targetX = glowX;
            let targetY = glowY;

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
            });

            function animateGlow() {
                glowX += (targetX - glowX) * 0.1;
                glowY += (targetY - glowY) * 0.1;
                cursorGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
                requestAnimationFrame(animateGlow);
            }
            animateGlow();

            // 3D Tilt Effect Script
            const cards = document.querySelectorAll('.link-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = ((y - centerY) / centerY) * -8;
                    const rotateY = ((x - centerX) / centerX) * 8;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-6px) scale(1.02)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
            });

            // Magnetic Effect Script
            const magnetics = document.querySelectorAll('.magnetic');
            magnetics.forEach(mag => {
                const parent = mag.parentElement;

                parent.addEventListener('mousemove', (e) => {
                    const rect = parent.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;

                    mag.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
                });

                parent.addEventListener('mouseleave', () => {
                    mag.style.transform = 'translate(0px, 0px)';
                });
            });
        }
    </script>

    <!-- Ripple Effect Script (Lightweight enough for mobile) -->
    <script>
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');

                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);

                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${e.clientX - rect.left - size/2}px`;
                ripple.style.top = `${e.clientY - rect.top - size/2}px`;

                this.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>

    <script>

                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
